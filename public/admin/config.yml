# Configuración de Sveltia CMS (panel /admin).
#
# Cada "Guardar" del panel crea un commit en la rama `build`, y ese push
# dispara el workflow de deploy (validación → build → FTP a Nominalia).
# El panel no tiene credenciales propias: se entra con GitHub (token personal
# restringido a este repositorio; pasos en docs/actualizar-datos.md).

backend:
  name: github
  repo: BerrioS-Eng/TechSinHumo
  branch: build # rama de producción: cada commit aquí despliega

# Sin campos de imagen por ahora; el esquema de configuración pide una carpeta.
media_folder: public/uploads
public_folder: /uploads

site_url: https://techsinhumo.com

collections:
  - name: datos
    label: Datos del comparador
    editor:
      preview: false
    files:
      - name: ofertas
        label: Catálogo de ofertas
        file: public/data/offers.json
        description: >-
          TODAS las ofertas, en un solo lugar. La portada muestra sola la de
          mayor ahorro de cada servicio, y el funnel enseña las del servicio
          que elige el usuario, ordenadas por ahorro. Precios y ahorros en
          €/mes (la web muestra el ahorro anualizado).
        fields:
          - name: offers
            label: Ofertas
            label_singular: oferta
            widget: list
            min: 1
            summary: '{{fields.op}} ({{fields.service}}) — {{fields.price}} €/mes'
            fields:
              - { name: op, label: Operador, widget: string }
              - name: service
                label: Servicio que cubre
                widget: relation
                collection: datos
                file: servicios
                search_fields: ['services.*.name']
                display_fields: ['services.*.name']
                value_field: 'services.*.id'
                hint: La portada destaca automáticamente la oferta de mayor ahorro de cada servicio.
              - name: price
                label: Precio (€/mes)
                widget: number
                value_type: float
                min: 1
                max: 500
                step: 0.01
              - name: save
                label: Ahorro (€/mes)
                widget: number
                value_type: float
                min: 0.01
                max: 500
                step: 0.01
                hint: Ahorro estimado frente a la factura del usuario, en €/mes; en la web se muestra anualizado («Ahorras N €/año», mensual × 12).
              - { name: fibre, label: Fibra, widget: string, required: false, default: '', hint: 'Ej.: «1 Gb sim.». Déjalo vacío si la oferta no incluye fibra.' }
              - { name: mobile, label: Móvil, widget: string, required: false, default: '', hint: 'Ej.: «30 GB + ilim.». Déjalo vacío si no incluye línea móvil.' }
              - { name: tv, label: TV, widget: string, required: false, default: '', hint: 'Ej.: «HBO Max + 80 canales». Déjalo vacío si no incluye TV.' }
              - { name: perm, label: Permanencia, widget: string, hint: 'Ej.: «Sin permanencia» o «12 meses»' }

      - name: servicios
        label: Servicios (paso 3 del funnel y categorías del catálogo)
        file: public/data/services.json
        description: >-
          Botones de «¿Qué servicio tienes?» y, a la vez, categorías de las
          ofertas: cada oferta del catálogo apunta a uno de estos ids, la
          portada destaca la mejor de cada uno y el backend de leads lee este
          mismo archivo. El identificador debe ser único y en
          minúsculas-con-guiones; una vez publicado, evita renombrarlo.
        fields:
          - name: services
            label: Servicios
            label_singular: servicio
            widget: list
            min: 1
            summary: '{{fields.name}}'
            fields:
              - name: id
                label: Identificador
                widget: string
                pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Solo minúsculas, números y guiones (ej. fibra-movil)']
              - { name: name, label: Nombre visible, widget: string }

      - name: operadores
        label: Operadores (paso 2 del funnel)
        file: public/data/providers.json
        description: >-
          Botones de «¿Con quién estás ahora?». Puedes añadir, editar o borrar
          libremente: el backend de leads lee este mismo archivo, todo se
          actualiza junto al publicar. El identificador debe ser único y en
          minúsculas-con-guiones; una vez publicado, evita renombrarlo.
        fields:
          - name: providers
            label: Operadores
            label_singular: operador
            widget: list
            min: 1
            summary: '{{fields.name}}'
            fields:
              - name: id
                label: Identificador
                widget: string
                pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Solo minúsculas, números y guiones (ej. masmovil)']
              - { name: name, label: Nombre visible, widget: string }
              - { name: note, label: Nota (opcional), widget: string, required: false, hint: 'Texto pequeño bajo el nombre, ej. «ex-Telefónica».' }