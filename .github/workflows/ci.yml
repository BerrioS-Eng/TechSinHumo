# Validación sin despliegue: ramas de trabajo y PRs hacia build.
# El deploy real (deploy.yml) repite estos pasos antes de subir por FTP.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [ build ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 #v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validar datos editables
        run: pnpm validate:data
      - run: pnpm build